name: ci

# Fast sanity check — runs on every PR + push to main, builds the
# project for the host platform only (no packaging, no upload). If
# this fails, the tag-triggered release workflow won't work either.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            script: build-mac.sh
          - os: windows-latest
            label: Windows
            script: build-windows.sh
          - os: ubuntu-22.04
            label: Linux
            script: build-linux.sh

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          python-version: '3.13'

      # macOS needs a framework build of Python (uv's default is non-framework,
      # which makes the .app crash with "A Python runtime could not be located").
      # brew provides python@3.13 as a framework build.
      - name: Install framework Python + create-dmg (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg python@3.13
          echo "PYTHON_BIN=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"

      # pywebview on Linux needs GTK WebKit — install the runtime libs so the
      # bundled binary can find them at launch time.
      - name: Install GTK WebKit runtime libs (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libnotify4 \
            libsecret-1-0 \
            libsoup-3.0-0

      # Windows and Linux runners don't ship `python`/`python3` by default.
      # setup-uv's python-version installs into uv's cache but `uv python find`
      # only locates interpreters in the default install location. Install
      # explicitly so find() returns the path.
      - name: Install Python 3.13 (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: uv python install 3.13

      - name: Resolve Python path (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: echo "PYTHON_BIN=$(uv python find 3.13)" >> "$GITHUB_ENV"

      - name: Build (no packaging)
        shell: bash
        run: ./scripts/${{ matrix.script }}