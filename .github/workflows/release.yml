name: release

# Triggered when a tag like `v0.1.0` is pushed. Builds manis for the
# three supported platforms in parallel, attaches the artifacts to a
# GitHub Release named after the tag.
#
# Tag-only trigger — every push to main is unaffected. To cut a release:
#
#     git tag v0.1.0
#     git push --tags
#
# The job will:
#   1. Build a release draft as soon as the first matrix leg finishes.
#   2. Upload each platform's artifact to that release.
#   3. Mark the release as "latest" once all legs have uploaded.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create / upload release assets

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one platform failing shouldn't cancel the others
      matrix:
        include:
          - os: macos-latest
            label: macOS
            script: build-mac.sh
            artifact_glob: 'manis-*-macOS-x86_64.*'
            # macos-latest runs on Apple Silicon (arm64) runners. We build
            # x86_64 because the user is on Intel; swap target_arch in
            # manis.spec to 'arm64' (or 'universal2') if shipping for M-series.
          - os: windows-latest
            label: Windows
            script: build-windows.sh
            artifact_glob: 'manis-*-windows.zip'
          - os: ubuntu-22.04
            label: Linux
            script: build-linux.sh
            artifact_glob: 'manis-*-linux-x86_64.tar.gz'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          python-version: '3.13'

      - name: Install create-dmg + framework Python (macOS)
        # macOS needs a *framework* build of Python 3.13 — uv's default
        # non-framework cpython produces an .app that crashes on first
        # launch with "A Python runtime could not be located".
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install create-dmg python@3.13
          # `brew --prefix python@3.13` is /opt/homebrew on arm64 runners,
          # /usr/local on x86_64 runners — we just use whatever brew gives.
          echo "PYTHON_BIN=$(brew --prefix python@3.13)/bin/python3.13" >> "$GITHUB_ENV"

      # pywebview on Linux needs GTK WebKit — install the libs so the bundle
      # can find them at runtime.
      - name: Install GTK WebKit runtime libs (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libnotify4 \
            libsecret-1-0 \
            libsoup-3.0-0

      - name: Build + package
        # Use bash explicitly — Windows defaults to PowerShell, which
        # trips over bash-isms in our scripts and the `ls -lh` below.
        shell: bash
        run: |
          chmod +x scripts/${{ matrix.script }}
          ./scripts/${{ matrix.script }}

      - name: List dist/
        shell: bash
        run: ls -lh dist/

      - name: Upload artifact to release
        uses: softprops/action-gh-release@v2
        with:
          # softprops figures out the release from the tag that triggered
          # the workflow — no need to pass tag_name explicitly.
          files: dist/${{ matrix.artifact_glob }}
          fail_on_unmatched_files: true
          # Each parallel job uploads independently; softprops will mark
          # the release as "latest" once any upload succeeds, which is
          # fine for our use case (the release is tagged + published only
          # when this workflow runs, so "latest" is unambiguous).
          make_latest: true